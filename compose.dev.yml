services:
  web:
    command: bundle exec bin/rails server -b 0.0.0.0
    environment:
      RAILS_ENV: development
    volumes:
      - .:/rails
      - app-storage:/rails/storage
      - bundle-data:/usr/local/bundle
    stdin_open: true
    tty: true

  worker:
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
    volumes:
      - .:/rails
      - app-storage:/rails/storage
      - bundle-data:/usr/local/bundle

  css:
    build:
      context: .
    command: bundle exec bin/rails tailwindcss:watch
    environment:
      RAILS_ENV: development
      POSTGRES_USER: ${POSTGRES_USER:-sure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sure_production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-a7523c3d0ae56415046ad8abae168d71074a79534a7062258f8d1d51ac2f76d3c3bc86d86b6b0b307df30d9a6a90a2066a3fa9e67c5e6f374dbd7dd4e0778e13}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN}
    env_file:
      - .env.local
    volumes:
      - .:/rails
      - app-storage:/rails/storage
      - bundle-data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - sure_net
    stdin_open: true
    tty: true

volumes:
  bundle-data:
